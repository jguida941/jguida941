name: Generate Metrics

on:
  schedule:
    # Run hourly off the top of the hour to reduce scheduler delay.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: profile-stats-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run profile product tests
        run: |
          python -m unittest \
            tests.github.test_github_client \
            tests.github.test_token_fallback \
            tests.pipeline.test_compute_metrics_accuracy \
            tests.pipeline.test_profile_pipeline_fixture \
            tests.contracts.test_data_semantics \
            tests.contracts.test_public_data_privacy \
            tests.contracts.test_design_contract

      # Probe the PAT once. If it is missing OR expired/invalid (e.g. 401), demote
      # to the always-valid github.token so an expired secret can never freeze the
      # profile. The resolved tokens + mode are exported via $GITHUB_ENV.
      - name: Resolve GitHub token
        env:
          CANDIDATE_PAT: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          use_default() {
            {
              echo "PERSONAL_GITHUB_TOKEN="
              echo "GITHUB_TOKEN=${DEFAULT_TOKEN}"
              echo "GH_TOKEN=${DEFAULT_TOKEN}"
              echo "PROFILE_TOKEN_MODE=github_token"
            } >> "$GITHUB_ENV"
          }
          if [ -z "${CANDIDATE_PAT}" ]; then
            echo "No PERSONAL_GITHUB_TOKEN secret set; using github.token."
            use_default
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CANDIDATE_PAT}" https://api.github.com/user || echo 000)
          if [ "${code}" = "200" ]; then
            exp=$(curl -sS -D - -o /dev/null \
              -H "Authorization: Bearer ${CANDIDATE_PAT}" https://api.github.com/user \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
            echo "PERSONAL_GITHUB_TOKEN healthy (expires: ${exp:-unknown})"
            echo "::notice::PERSONAL_GITHUB_TOKEN healthy; expires ${exp:-unknown}"
            {
              echo "PERSONAL_GITHUB_TOKEN=${CANDIDATE_PAT}"
              echo "GITHUB_TOKEN=${DEFAULT_TOKEN}"
              echo "GH_TOKEN=${CANDIDATE_PAT}"
              echo "PROFILE_TOKEN_MODE=personal_github_token"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::PERSONAL_GITHUB_TOKEN returned HTTP ${code}; using github.token. Private repos + contribution calendar fall back to last-known-good."
            use_default
          fi

      - name: Generate and validate canonical profile artifacts
        env:
          GITHUB_USERNAME: jguida941
          PROFILE_TIMEZONE: America/New_York
        run: |
          echo "Token mode: ${PROFILE_TOKEN_MODE}"
          python scripts/profile_cli.py generate-profile

      - name: Validate generated profile artifacts
        env:
          GITHUB_USERNAME: jguida941
          PROFILE_TIMEZONE: America/New_York
        run: python scripts/profile_cli.py validate

      # One typed product decision governs every canonical publish effect below.
      # Readiness is evidence about the artifact set, never a rendered repository
      # count: a degraded run keeps the last accepted artifacts and stays green,
      # and an invalid set fails the run.
      - name: Decide whether to publish
        id: gate
        env:
          GITHUB_USERNAME: jguida941
          PROFILE_TIMEZONE: America/New_York
        run: python scripts/profile_cli.py publication-status --github-output "$GITHUB_OUTPUT"

      - name: Upload canonical profile artifacts
        if: ${{ success() && steps.gate.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: profile-hourly-artifacts
          path: |
            README.md
            assets/activity_heatmap.svg
            assets/badges.svg
            assets/builder_scorecard.svg
            assets/contribution_calendar.svg
            assets/currently_working.svg
            assets/engineering_cadence.svg
            assets/lang_breakdown.svg
            assets/now_next_shipped.svg
            assets/raw_snapshot.svg
            assets/repo_spotlight.svg
            assets/streak_summary.svg
            metrics.general.svg
            site/data/profile_snapshot.json
            site/data/profile_artifact_manifest.json

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ success() && steps.gate.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commit_message: "update canonical profile artifacts"
          branch: main
          file_pattern: "README.md assets/activity_heatmap.svg assets/badges.svg assets/builder_scorecard.svg assets/contribution_calendar.svg assets/currently_working.svg assets/engineering_cadence.svg assets/lang_breakdown.svg assets/now_next_shipped.svg assets/raw_snapshot.svg assets/repo_spotlight.svg assets/streak_summary.svg metrics.general.svg site/data/profile_snapshot.json site/data/profile_artifact_manifest.json"
