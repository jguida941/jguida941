name: Generate Metrics

on:
  schedule:
    # Run hourly off the top of the hour to reduce scheduler delay.
    - cron: "45 * * * *"
  workflow_dispatch:

concurrency:
  group: profile-stats-pipeline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Select publication source
        id: source
        run: |
          # A queued main event may predate the preceding publisher's commit.
          # Empty input preserves checkout's event ref and SHA for other refs.
          source_ref=''
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            source_ref=main
          fi
          printf 'ref=%s\n' "$source_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}

      - name: Report generation source
        run: |
          generation_source=$(git rev-parse HEAD)
          printf 'Workflow event SHA: %s\n' "$GITHUB_SHA"
          printf 'Checked-out generation SHA: %s\n' "$generation_source"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Probe the PAT once. If it is missing OR expired/invalid (e.g. 401), demote
      # to the always-valid github.token so an expired secret can never freeze the
      # profile. The resolved tokens + mode are exported via $GITHUB_ENV.
      - name: Resolve GitHub token
        env:
          CANDIDATE_PAT: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          use_default() {
            {
              echo "PERSONAL_GITHUB_TOKEN="
              echo "GITHUB_TOKEN=${DEFAULT_TOKEN}"
              echo "GH_TOKEN=${DEFAULT_TOKEN}"
              echo "PROFILE_TOKEN_MODE=github_token"
            } >> "$GITHUB_ENV"
          }
          if [ -z "${CANDIDATE_PAT}" ]; then
            echo "No PERSONAL_GITHUB_TOKEN secret set; using github.token."
            use_default
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CANDIDATE_PAT}" https://api.github.com/user || echo 000)
          if [ "${code}" = "200" ]; then
            exp=$(curl -sS -D - -o /dev/null \
              -H "Authorization: Bearer ${CANDIDATE_PAT}" https://api.github.com/user \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
            echo "PERSONAL_GITHUB_TOKEN healthy (expires: ${exp:-unknown})"
            echo "::notice::PERSONAL_GITHUB_TOKEN healthy; expires ${exp:-unknown}"
            {
              echo "PERSONAL_GITHUB_TOKEN=${CANDIDATE_PAT}"
              echo "GITHUB_TOKEN=${DEFAULT_TOKEN}"
              echo "GH_TOKEN=${CANDIDATE_PAT}"
              echo "PROFILE_TOKEN_MODE=personal_github_token"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::PERSONAL_GITHUB_TOKEN returned HTTP ${code}; using github.token. Private repos + contribution calendar fall back to last-known-good."
            use_default
          fi

      # The generation token shares one hourly API budget with every other client of
      # its account, and generation re-reads every repository. Starting it near an
      # exhausted window fails all collection with HTTP 403. Reading the budget is
      # free: when it is short and resets soon, wait for the reset. The log keeps the
      # budget either way, so a later collection failure can be read against it.
      # One generation measured 414 REST requests on 2026-11-24; the need adds margin.
      - name: Wait for the generation token's API budget
        env:
          PROFILE_API_BUDGET_NEED: "600"
          PROFILE_API_BUDGET_MAX_WAIT: "900"
        run: |
          read_budget() { gh api rate_limit --jq '.resources.core | "\(.remaining) \(.limit) \(.reset)"' || true; }
          budget="$(read_budget)"
          if ! printf '%s' "${budget}" | grep -Eq '^[0-9]+ [0-9]+ [0-9]+$'; then
            echo "::notice::API budget unreadable; generating without waiting."
            exit 0
          fi
          read -r remaining limit reset <<< "${budget}"
          # A github.token fallback has a smaller per-repository limit; never wait for more than it holds.
          need="${PROFILE_API_BUDGET_NEED}"
          if [ "${limit}" -lt "${need}" ]; then need="${limit}"; fi
          wait_seconds=$(( reset - $(date +%s) + 5 ))
          echo "API budget: ${remaining} of ${limit} remaining; resets in ${wait_seconds}s; generation needs about ${need}."
          if [ "${remaining}" -ge "${need}" ]; then
            exit 0
          fi
          if [ "${wait_seconds}" -gt 0 ] && [ "${wait_seconds}" -le "${PROFILE_API_BUDGET_MAX_WAIT}" ]; then
            echo "::notice::Waiting ${wait_seconds}s for the API budget to reset."
            sleep "${wait_seconds}"
            echo "API budget after waiting: $(read_budget)"
          else
            echo "::warning::API budget is short (${remaining}) and does not reset within ${PROFILE_API_BUDGET_MAX_WAIT}s; collection may fail with HTTP 403."
          fi

      - name: Generate and validate canonical profile artifacts
        env:
          GITHUB_USERNAME: jguida941
          PROFILE_TIMEZONE: America/New_York
        run: |
          echo "Token mode: ${PROFILE_TOKEN_MODE}"
          python scripts/profile_cli.py generate-profile

      - name: Validate generated profile artifacts
        env:
          GITHUB_USERNAME: jguida941
          PROFILE_TIMEZONE: America/New_York
        run: python scripts/profile_cli.py validate

      - name: Run profile product tests
        env:
          PERSONAL_GITHUB_TOKEN: ""
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          PROFILE_TOKEN_MODE: none
          CACHE_DIR: ${{ runner.temp }}/profile-product-tests
          BYPASS_GITHUB_CACHE: "true"
        run: |
          python -m unittest \
            tests.github.test_github_client \
            tests.github.test_actions_audit \
            tests.github.test_token_fallback \
            tests.pipeline.test_compute_metrics_accuracy \
            tests.pipeline.test_profile_pipeline_fixture \
            tests.contracts.test_data_semantics \
            tests.contracts.test_public_data_privacy \
            tests.contracts.test_design_contract \
            tests.contracts.test_web_dashboard \
            tests.contracts.test_page_manifest \
            tests.contracts.test_dashboard_summary \
            tests.contracts.test_dashboard_destinations \
            tests.contracts.test_readme_projection \
            tests.contracts.test_design_nav \
            tests.contracts.test_label_legibility

      # One typed product decision governs every canonical publish effect below.
      # Readiness is evidence about the artifact set, never a rendered repository
      # count: held evidence keeps the last accepted artifacts. An unusable
      # selected CI cohort fails generation before reaching this stored-set gate.
      - name: Decide whether to publish
        id: gate
        env:
          GITHUB_USERNAME: jguida941
          PROFILE_TIMEZONE: America/New_York
        run: python scripts/profile_cli.py publication-status --github-output "$GITHUB_OUTPUT"

      - name: Upload canonical profile artifacts
        if: ${{ success() && steps.gate.outputs.publish == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: profile-hourly-artifacts
          path: |
            README.md
            assets/activity_heatmap.svg
            assets/dashboard_summary.svg
            assets/dashboard_summary_mobile.svg
            assets/badges.svg
            assets/builder_scorecard.svg
            assets/contribution_calendar.svg
            assets/currently_working.svg
            assets/engineering_cadence.svg
            assets/lang_breakdown.svg
            assets/now_next_shipped.svg
            assets/raw_snapshot.svg
            assets/repo_spotlight.svg
            assets/streak_summary.svg
            metrics.general.svg
            site/data/profile_snapshot.json
            site/data/profile_artifact_manifest.json

      # These existing diagnostics retain collection failures even when no new
      # canonical artifacts were written. Provider response bodies are excluded.
      - name: Upload diagnostics artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: profile-diagnostics
          path: |
            site/data/run_diagnostics.json
            site/data/run_diagnostics_history.jsonl

      - uses: stefanzweifel/git-auto-commit-action@v5
        if: ${{ success() && steps.gate.outputs.publish == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          commit_message: "update canonical profile artifacts"
          branch: main
          file_pattern: "README.md assets/dashboard_summary.svg assets/dashboard_summary_mobile.svg assets/activity_heatmap.svg assets/badges.svg assets/builder_scorecard.svg assets/contribution_calendar.svg assets/currently_working.svg assets/engineering_cadence.svg assets/lang_breakdown.svg assets/now_next_shipped.svg assets/raw_snapshot.svg assets/repo_spotlight.svg assets/streak_summary.svg metrics.general.svg site/data/profile_snapshot.json site/data/profile_artifact_manifest.json"
