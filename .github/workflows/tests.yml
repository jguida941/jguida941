name: Test Profile Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "contracts/**"
      - "assets/receipts/**"
      - "docs/design/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/analytics.yml"
      - ".github/workflows/metrics.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "contracts/**"
      - "assets/receipts/**"
      - "docs/design/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/analytics.yml"
      - ".github/workflows/metrics.yml"
  workflow_dispatch:

concurrency:
  group: profile-pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest \
            tests.github.test_github_client \
            tests.github.test_actions_audit \
            tests.github.test_token_fallback \
            tests.pipeline.test_compute_metrics_accuracy \
            tests.pipeline.test_profile_pipeline_fixture \
            tests.contracts.test_data_semantics \
            tests.contracts.test_public_data_privacy \
            tests.contracts.test_design_contract \
            tests.contracts.test_web_dashboard \
            tests.contracts.test_page_manifest \
            tests.contracts.test_dashboard_summary \
            tests.contracts.test_readme_projection \
            tests.contracts.test_visual_receipt_provenance \
            tests.contracts.test_skill_structure \
            tests.contracts.test_label_legibility

      # Candidate evidence only. This uses the existing Linux test runner's
      # genuine Google Chrome, not a new self-hosted/public publisher trust.
      # Run AFTER static tests but BEFORE the fixture smoke CLI, so no synthetic
      # profile snapshot can masquerade as a live observed screenshot.
      - name: Capture real index Chrome receipts (development candidate only)
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'development' }}
        env:
          PROFILE_TIMEZONE: America/New_York
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          from scripts.quality.headless_receipts import (
              screenshot_page, dom_probe, provenance_path, _chrome_version, _chrome,
          )
          Path("site/assets").mkdir(parents=True, exist_ok=True)
          for name in ("dashboard_summary.svg", "dashboard_summary_mobile.svg"):
              shutil.copyfile(Path("assets") / name, Path("site/assets") / name)
          actual = json.loads(Path("site/data/profile_snapshot.json").read_text())
          timeline = actual.get("ci_timeline")
          print("Candidate snapshot CI status:",
                timeline.get("status") if isinstance(timeline, dict) else "UNAVAILABLE")
          print("Google Chrome:", _chrome_version(_chrome()))
          general = screenshot_page("index")
          focused = screenshot_page("index", target="ci-observatory")
          mobile = dom_probe("index")
          data = json.loads(mobile.read_text())
          if (data.get("client_width") != 390 or
                  data.get("horizontal_overflow") or
                  data.get("uncontained_offender_count")):
              raise RuntimeError(
                  "Actual Chrome 390px overflow proof failed: " +
                  json.dumps({"client_width": data.get("client_width"),
                              "overflow": data.get("horizontal_overflow"),
                              "offenders": data.get("offenders"),
                              "uncontained": data.get("uncontained_offender_count")}, sort_keys=True))
          for artifact in (general, focused, mobile):
              if not artifact.is_file() or not provenance_path(artifact).is_file():
                  raise RuntimeError("Missing genuine browser evidence")
              print("Chrome produced:", artifact)
          PY

      - name: Upload raw unaccepted browser evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.head_ref == 'development' }}
        uses: actions/upload-artifact@v4
        with:
          name: index-chrome-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/receipts/pages/index/screenshot-1280.png
            assets/receipts/pages/index/screenshot-1280.png.provenance.json
            assets/receipts/pages/index/ci-observatory-1280.png
            assets/receipts/pages/index/ci-observatory-1280.png.provenance.json
            assets/receipts/pages/index/dom-probe-390.json
            assets/receipts/pages/index/dom-probe-390.json.provenance.json

      - name: Fixture smoke CLI run (offline path)
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          PERSONAL_GITHUB_TOKEN: ""
        run: |
          python scripts/profile_cli.py generate-profile --validate --fixture tests/fixtures/sample_collected_data.json
