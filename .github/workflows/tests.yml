name: Test Profile Pipeline

on:
  push:
    branches: ["main", "development"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "contracts/**"
      - "assets/receipts/**"
      - "docs/design/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/analytics.yml"
      - ".github/workflows/metrics.yml"
  pull_request:
    branches: ["main", "development"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "contracts/**"
      - "assets/receipts/**"
      - "docs/design/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/analytics.yml"
      - ".github/workflows/metrics.yml"
  workflow_dispatch:

concurrency:
  group: profile-pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest \
            tests.github.test_github_client \
            tests.github.test_actions_audit \
            tests.github.test_token_fallback \
            tests.pipeline.test_compute_metrics_accuracy \
            tests.pipeline.test_profile_pipeline_fixture \
            tests.contracts.test_data_semantics \
            tests.contracts.test_public_data_privacy \
            tests.contracts.test_design_contract \
            tests.contracts.test_web_dashboard \
            tests.contracts.test_page_manifest \
            tests.contracts.test_dashboard_summary \
            tests.contracts.test_readme_projection \
            tests.contracts.test_visual_receipt_provenance \
            tests.contracts.test_skill_structure \
            tests.contracts.test_design_nav \
            tests.contracts.test_label_legibility

      # Candidate evidence only. This uses the existing Linux test runner's
      # genuine Google Chrome, not a new self-hosted/public publisher trust.
      # Run AFTER static tests but BEFORE the fixture smoke CLI, so no synthetic
      # profile snapshot can masquerade as a live observed screenshot.
      - name: Capture real index Chrome receipts for the receiving candidate
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          PROFILE_TIMEZONE: America/New_York
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          from scripts.quality.headless_receipts import (
              screenshot_page, dom_probe, provenance_path, _chrome_version, _chrome,
          )
          Path("site/assets").mkdir(parents=True, exist_ok=True)
          for name in ("dashboard_summary.svg", "dashboard_summary_mobile.svg"):
              shutil.copyfile(Path("assets") / name, Path("site/assets") / name)
          actual = json.loads(Path("site/data/profile_snapshot.json").read_text())
          timeline = actual.get("ci_timeline")
          print("Candidate snapshot CI status:",
                timeline.get("status") if isinstance(timeline, dict) else "UNAVAILABLE")
          print("Google Chrome:", _chrome_version(_chrome()))
          general = screenshot_page("index")
          focused = screenshot_page("index", target="ci-observatory")
          mobile = dom_probe("index")
          data = json.loads(mobile.read_text())
          if (data.get("client_width") != 390 or
                  data.get("horizontal_overflow") or
                  data.get("uncontained_offender_count")):
              raise RuntimeError(
                  "Actual Chrome 390px overflow proof failed: " +
                  json.dumps({"client_width": data.get("client_width"),
                              "overflow": data.get("horizontal_overflow"),
                              "offenders": data.get("offenders"),
                              "uncontained": data.get("uncontained_offender_count")}, sort_keys=True))
          for artifact in (general, focused, mobile):
              if not artifact.is_file() or not provenance_path(artifact).is_file():
                  raise RuntimeError("Missing genuine browser evidence")
              print("Chrome produced:", artifact)
          PY

      - name: Upload raw unaccepted browser evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: index-chrome-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/receipts/pages/index/screenshot-1280.png
            assets/receipts/pages/index/screenshot-1280.png.provenance.json
            assets/receipts/pages/index/ci-observatory-1280.png
            assets/receipts/pages/index/ci-observatory-1280.png.provenance.json
            assets/receipts/pages/index/dom-probe-390.json
            assets/receipts/pages/index/dom-probe-390.json.provenance.json

      - name: Fixture smoke CLI run (offline path)
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          PERSONAL_GITHUB_TOKEN: ""
        run: |
          python scripts/profile_cli.py generate-profile --validate --fixture tests/fixtures/sample_collected_data.json

  # Temporary receiving job: generate, inspect and commit only on this task ref.
  # Removed after original evidence and the coherent output set are received.
  overview-preview:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 29 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'work/overview-publication-20261119' && github.base_ref == 'development' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      GITHUB_USERNAME: jguida941
      PROFILE_TIMEZONE: America/New_York
      CANDIDATE_HEAD: ${{ github.event.pull_request.head.sha }}
      CANDIDATE_REF: work/overview-publication-20261119
      PREVIEW_LIVE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install existing product and preview dependencies
        run: python -m pip install -r requirements.txt playwright==1.62.0
      - name: Resolve GitHub token
        env:
          CANDIDATE_PAT: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
          DEFAULT_TOKEN: ${{ github.token }}
        run: |
          use_default() {
            {
              echo "PERSONAL_GITHUB_TOKEN="
              echo "GITHUB_TOKEN=${DEFAULT_TOKEN}"
              echo "GH_TOKEN=${DEFAULT_TOKEN}"
              echo "PROFILE_TOKEN_MODE=github_token"
            } >> "$GITHUB_ENV"
          }
          if [ -z "${CANDIDATE_PAT}" ]; then use_default; exit 0; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${CANDIDATE_PAT}" https://api.github.com/user || echo 000)
          if [ "${code}" = "200" ]; then
            echo "::notice::PERSONAL_GITHUB_TOKEN healthy."
            {
              echo "PERSONAL_GITHUB_TOKEN=${CANDIDATE_PAT}"
              echo "GITHUB_TOKEN=${DEFAULT_TOKEN}"
              echo "GH_TOKEN=${CANDIDATE_PAT}"
              echo "PROFILE_TOKEN_MODE=personal_github_token"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::PERSONAL_GITHUB_TOKEN returned HTTP ${code}; using github.token."
            use_default
          fi

      - name: Generate the actual candidate snapshot and canonical artifacts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          python scripts/profile_cli.py generate-profile
          python scripts/profile_cli.py validate
          python scripts/profile_cli.py publication-status --require-ready
          python - <<'PY_BIND'
          import hashlib,json,os
          from pathlib import Path
          output=Path(os.environ['RUNNER_TEMP'])/'overview-live'
          output.mkdir()
          raw=Path('site/data/profile_snapshot.json').read_bytes()
          (output/'profile-snapshot.json').write_bytes(raw)
          ci=(json.dumps(json.loads(raw)['ci_timeline'],indent=2)+'\n').encode()
          (output/'ci-observations.json').write_bytes(ci)
          with open(os.environ['GITHUB_ENV'],'a') as target:
              for key,value in {'PREVIEW_OUTPUT':str(output),
                'PREVIEW_SNAPSHOT':str(output/'profile-snapshot.json'),
                'PREVIEW_CI_CAPTURE':str(output/'ci-observations.json'),
                'PREVIEW_SNAPSHOT_SHA256':hashlib.sha256(raw).hexdigest(),
                'PREVIEW_CI_SHA256':hashlib.sha256(ci).hexdigest()}.items():
                  target.write(key+'='+value+'\n')
          PY_BIND
      - name: Inspect generated public and private CI observations in actual Chrome
        run: |
          set -euo pipefail
          python -B - <<'PY_CAPTURE'
          """One-shot review of the exact overview renderers using a retained public snapshot."""
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import copy
          import hashlib
          import json
          import os
          import re
          import shutil
          import subprocess
          import sys
          from playwright.sync_api import sync_playwright

          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT))
          from scripts.pipeline.web_render import render_dashboard
          from scripts.rendering.generate_dashboard_summary import render_svg
          from scripts.rendering.design_tokens import THEMES
          from scripts.quality import headless_receipts

          OUT = Path(os.environ['PREVIEW_OUTPUT'])
          OUT.mkdir(parents=True, exist_ok=True)
          raw = Path(os.environ['PREVIEW_SNAPSHOT']).read_bytes()
          live_capture = os.environ.get('PREVIEW_LIVE') == '1'
          expected_snapshot_sha = os.environ.get('PREVIEW_SNAPSHOT_SHA256') if live_capture else '34f411fc6e203d0d4187915a234f4e5cc88f56af12254c52e95e4c8c47f22704'
          assert hashlib.sha256(raw).hexdigest() == expected_snapshot_sha
          data = json.loads(raw)
          ci_capture = Path(os.environ['PREVIEW_CI_CAPTURE'])
          ci_raw = ci_capture.read_bytes()
          assert hashlib.sha256(ci_raw).hexdigest() == os.environ['PREVIEW_CI_SHA256']
          timeline = json.loads(ci_raw)
          assert timeline['schema'] == 'profile-ci-timeline/v1'
          assert any(r.get('is_private') and r.get('runs') for r in timeline['repositories'])
          assert any(r['repository'] == 'jguida941/dijkstra-dashboard' and r.get('runs') for r in timeline['repositories'])
          if live_capture:
              assert data['ci_timeline'] == timeline == data['dashboard_summary']['ci_timeline']
          else:
              data['ci_timeline'] = timeline
              data['dashboard_summary']['ci_timeline'] = copy.deepcopy(timeline)
          summary = data['dashboard_summary']
          facts = {row['metric_id']: row for row in summary['facts']}
          expected_time = datetime.fromisoformat(data['generated_at'].replace('Z', '+00:00')).astimezone(ZoneInfo('America/New_York')).strftime('Updated %b %-d, %Y, %-I:%M %p %Z')
          (ROOT / 'site/data').mkdir(parents=True, exist_ok=True)
          if not live_capture:
              (ROOT / 'site/data/profile_snapshot.json').write_text(json.dumps(data, indent=2)+'\n')
          page_path = ROOT / 'site/index.html'
          page_path.write_text(render_dashboard())
          chrome = next((str(p) for p in (Path('/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'),
                         Path(shutil.which('google-chrome') or '/nonexistent'), Path(shutil.which('google-chrome-stable') or '/nonexistent')) if p.is_file()), None)
          assert chrome, 'Actual Google Chrome is required'
          version = subprocess.check_output([chrome, '--version'], text=True).strip()
          # Use the existing producer with the actual installed browser path. The path is
          # retained in its own command/version sidecars; no browser evidence is fabricated.
          headless_receipts.CHROME = Path(chrome)
          headless_receipts.screenshot_page('index', 1280)
          probe_path = headless_receipts.dom_probe('index', 390)
          probe = json.loads(probe_path.read_text())
          assert probe['client_width'] == 390, probe
          shutil.copytree(ROOT / 'assets/receipts/pages/index', OUT / 'index-receipts', dirs_exist_ok=True)
          legacy_qualification = None
          if probe['horizontal_overflow']:
              # Retain the unchanged producer receipt above. Expand diagnostics only;
              # neither the producer's classification nor its failure is waived.
              original_probe_html = headless_receipts._probe_html
              def diagnostic_probe_html(*args, **kwargs):
                  emitted = original_probe_html(*args, **kwargs)
                  emitted = emitted.replace('offenders.slice(0, 20)', 'offenders')
                  emitted = emitted.replace('offenders.push({', '''var clipParent=el.parentElement;
                  var clipStyle=frame.contentWindow.getComputedStyle(clipParent);
                  var clipRect=clipParent.getBoundingClientRect();
                  var clipEvidence={anchor:el.tagName.toLowerCase()==="a",href:el.href||"",position:style.position,
                    parent_tag:clipParent.tagName.toLowerCase(),parent_class:clipParent.className,
                    direct_parent:true,code_changes_parent:clipParent.matches(".code-changes .code-branch"),
                    left:clipRect.left,right:clipRect.right,width:clipRect.width,height:clipRect.height,
                    overflow_x:clipStyle.overflowX,overflow_y:clipStyle.overflowY,
                    white_space:clipStyle.whiteSpace,text_overflow:clipStyle.textOverflow};
                  offenders.push({"clip_evidence":clipEvidence,''')
                  emitted = emitted.replace('"tag": el.tagName.toLowerCase(),',
                      '\"closed_details\": !!el.closest(\"details:not([open])\"), \"parent_class\": el.parentElement.className, \"parent_overflow\": frame.contentWindow.getComputedStyle(el.parentElement).overflowX, \"html\": el.outerHTML.slice(0, 350), \"tag\": el.tagName.toLowerCase(),')
                  return emitted
              headless_receipts._probe_html = diagnostic_probe_html
              try:
                  diagnostic = json.loads(headless_receipts.dom_probe('index', 390).read_text())
              finally:
                  headless_receipts._probe_html = original_probe_html
              (OUT/'legacy-expanded-diagnostic.json').write_text(json.dumps(diagnostic,indent=2)+'\n')
              uncontained = [row for row in diagnostic['offenders'] if not any(row.get(key) for key in ('contained_by_table_scroll','contained_by_calendar_scroll','contained_by_ci_plot_scroll','contained_by_code_branch_ellipsis'))]
              print('LEGACY_UNCONTAINED_DIAGNOSTIC', json.dumps(uncontained))
              # This prospective preview qualification is separate from the unchanged
              # producer, whose original failed receipt remains in index-receipts.
              assert os.environ.get('ALLOW_LEGACY_CODE_BRANCH_ELLIPSIS') == '1', probe
              assert diagnostic['scroll_width'] <= 391 and diagnostic['body_scroll_width'] <= 391, diagnostic
              assert len(uncontained) == 1, uncontained
              measured = uncontained[0]['clip_evidence']
              assert measured['anchor'] and re.fullmatch(r'https://github\.com/[^/]+/[^/]+/commit/[0-9a-f]{40}', measured['href']), measured
              assert measured['position'] == 'static' and measured['direct_parent'] and measured['code_changes_parent'], measured
              assert measured['parent_tag'] == 'p' and measured['parent_class'] == 'code-branch', measured
              assert measured['overflow_x'] == measured['overflow_y'] == 'hidden', measured
              assert measured['white_space'] == 'nowrap' and measured['text_overflow'] == 'ellipsis', measured
              assert measured['left'] >= -1 and measured['right'] <= 391 and measured['width'] > 1 and measured['height'] > 1, measured
              legacy_qualification = {'original_producer_passed':False,'qualification':'Only the observed direct static commit anchor is clipped by its existing in-viewport code-branch ellipsis parent. Current CI checks remain independent.','measured':measured}
              (OUT/'legacy-producer-qualification.json').write_text(json.dumps(legacy_qualification,indent=2)+'\n')
          assert not probe['horizontal_overflow'] or legacy_qualification is not None, probe

          records = []
          with sync_playwright() as p:
              browser = p.chromium.launch(executable_path=chrome, headless=True, args=['--allow-file-access-from-files'])
              for width in (1280, 390):
                  for theme in THEMES:
                      page = browser.new_page(viewport={'width': width, 'height': 1000}, device_scale_factor=1, timezone_id='Pacific/Honolulu')
                      errors = []
                      page.on('pageerror', lambda error: errors.append(str(error)))
                      page.goto(page_path.as_uri() + '?theme=' + theme, wait_until='load')
                      page.wait_for_function("document.getElementById('updated').textContent.startsWith('Updated ')")
                      assert page.locator('#updated').inner_text() == expected_time
                      assert page.locator('#hero-contribution-total').inner_text() == facts['profile.contributions']['display_value']
                      result = page.locator('.hero').evaluate('''hero => {
                        const box = hero.getBoundingClientRect();
                        const walker = document.createTreeWalker(hero, NodeFilter.SHOW_TEXT);
                        const texts = []; let node;
                        while (node = walker.nextNode()) {
                          if (!node.textContent.trim()) continue;
                          const range = document.createRange(); range.selectNodeContents(node);
                          const r = range.getBoundingClientRect();
                          if (r.width && r.height) texts.push({text:node.textContent.trim(), left:r.left, right:r.right, top:r.top, bottom:r.bottom});
                        }
                        const link = hero.querySelector('.github-profile-link');
                        const mark = link.querySelector('svg'); const style = getComputedStyle(mark);
                        const l = link.getBoundingClientRect();
                        return {width:innerWidth, hero:{left:box.left,right:box.right,top:box.top,bottom:box.bottom}, texts,
                          link:{href:link.href,width:l.width,height:l.height}, mark:{fill:style.fill,stroke:style.stroke},
                          overflowing:texts.filter(r=>r.left < box.left || r.right > box.right || r.top < box.top || r.bottom > box.bottom)};
                      }''')
                      assert result['width'] == width and not result['overflowing'], result
                      assert result['link']['height'] >= 44 and result['link']['href'] == 'https://github.com/jguida941'
                      assert result['mark']['stroke'] == 'none' and result['mark']['fill'] != 'none'
                      page.locator('.github-profile-link').focus()
                      page.keyboard.press('Tab')
                      page.keyboard.press('Shift+Tab')
                      focus = page.locator('.github-profile-link').evaluate('(a)=>({active:document.activeElement===a,visible:a.matches(":focus-visible"),outline:getComputedStyle(a).outlineStyle})')
                      assert focus['active'] and focus['visible'] and focus['outline'] != 'none', focus
                      assert not errors, errors
                      screenshot = OUT / f'home-{theme}-{width}.png'
                      page.screenshot(path=str(screenshot))
                      records.append({'kind':'website','theme':theme,'viewport':{'width':width,'height':1000},'probe':result,'focus':focus,'screenshot':screenshot.name,'screenshot_sha256':hashlib.sha256(screenshot.read_bytes()).hexdigest()})
                      ci = page.locator('#ci-observatory')
                      assert ci.is_visible()
                      ci.scroll_into_view_if_needed()
                      groups = ci.locator('[data-role="ci-group"]').evaluate_all("nodes => nodes.map(n=>({repository:n.dataset.repository,start:n.dataset.windowStart,end:n.dataset.windowEnd,count:Number(n.dataset.runCount),width:n.getBoundingClientRect().width,height:n.getBoundingClientRect().height}))")
                      assert groups and all(g['width'] >= 44 and g['height'] >= 44 for g in groups), groups
                      count_geometry = ci.locator('.ci-outcome-mark').evaluate_all('''nodes => nodes.map(n => {
                        const count=n.querySelector('.ci-mark-count'), mark=n.querySelector('.ci-mark');
                        const c=count.getBoundingClientRect(), m=mark.getBoundingClientRect();
                        const role=document.createElement('span'); role.style.color='var(--ink-strong)';
                        n.appendChild(role); const expected=getComputedStyle(role).color; role.remove();
                        return {text:count.textContent,fontSize:parseFloat(getComputedStyle(count).fontSize),
                          color:getComputedStyle(count).color,expected,
                          count:{left:c.left,right:c.right,top:c.top,bottom:c.bottom},
                          mark:{left:m.left,right:m.right,top:m.top,bottom:m.bottom}};
                      })''')
                      assert count_geometry and all(c['fontSize'] >= 12 and c['color'] == c['expected']
                          and c['count']['top'] >= c['mark']['bottom'] - 0.5 for c in count_geometry), count_geometry
                      expected_rows = {r['repository']:len(r['runs']) for r in timeline['repositories']}
                      actual_counts = {name:sum(g['count'] for g in groups if g['repository'] == name) for name in expected_rows}
                      assert actual_counts == expected_rows, (actual_counts,expected_rows)
                      initial_scroll = ci.locator('#ci-timeline-scroll').evaluate("n=>({left:n.scrollLeft,width:n.clientWidth,total:n.scrollWidth})")
                      assert initial_scroll['left'] + initial_scroll['width'] >= initial_scroll['total'] - 1, initial_scroll
                      default_screenshot = OUT / f'ci-default-{theme}-{width}.png'
                      ci.screenshot(path=str(default_screenshot))
                      records.append({'kind':'ci-default','theme':theme,'width':width,'screenshot':default_screenshot.name})
                      private_name = next(r['repository'] for r in timeline['repositories'] if r.get('is_private') and r.get('runs'))
                      private_groups = ci.locator('[data-role="ci-group"]').evaluate_all("(nodes,name)=>nodes.map((n,i)=>({n,i})).filter(x=>x.n.dataset.repository===name).map(x=>x.i)",private_name)
                      assert private_groups,private_name
                      chosen = ci.locator('[data-role="ci-group"]').nth(private_groups[-1])
                      selected_attrs = chosen.evaluate("n=>({repository:n.dataset.repository,start:n.dataset.windowStart,end:n.dataset.windowEnd})")
                      chosen.click()
                      selected = ci.locator('[data-role="ci-run-detail"]').evaluate_all("nodes=>nodes.map(n=>({repository:n.dataset.repository,id:Number(n.dataset.runId),at:n.dataset.createdAt,outcome:n.dataset.outcome,href:n.querySelector('a').href,text:n.textContent}))")
                      assert selected and all(r['repository']==private_name for r in selected),selected
                      expected_source = next(r['runs'] for r in timeline['repositories'] if r['repository']==private_name)
                      source_by_id = {r['run_id']:r for r in expected_source}
                      for r in selected:
                          source = source_by_id[r['id']]
                          assert r['outcome']==source['outcome']
                          assert datetime.fromisoformat(r['at'].replace('Z','+00:00')) == datetime.fromisoformat(source['created_at'].replace('Z','+00:00'))
                          assert r['href'] == 'https://github.com/'+private_name+'/actions/runs/'+str(r['id'])
                          assert source['workflow'] in r['text']
                      chosen.focus()
                      page.keyboard.press('Tab')
                      page.keyboard.press('Shift+Tab')
                      group_focus = chosen.evaluate('(n)=>({active:document.activeElement===n,visible:n.matches(":focus-visible"),outline:getComputedStyle(n).outlineStyle})')
                      assert group_focus['active'] and group_focus['visible'] and group_focus['outline']!='none',group_focus
                      bounds = ci.evaluate("""panel=>{
                        const p=panel.getBoundingClientRect();
                        const scrollers=[...panel.querySelectorAll('.ci-plot-scroll')].map(n=>{const b=n.getBoundingClientRect();return{left:b.left,right:b.right,width:b.width,scrollWidth:n.scrollWidth,clientWidth:n.clientWidth,overflow:getComputedStyle(n).overflowX}});
                        const labels=[...panel.querySelectorAll('a, h2, p, summary')].filter(n=>!n.closest('.ci-plot-scroll')&&!n.closest('details:not([open])')).map(n=>{const b=n.getBoundingClientRect();return{text:n.textContent,left:b.left,right:b.right,width:b.width,height:b.height}}).filter(r=>r.width>0&&r.height>0);
                        return{viewport:innerWidth,documentWidth:document.documentElement.scrollWidth,panel:{left:p.left,right:p.right},scrollers,overflowing:labels.filter(r=>r.left<p.left-1||r.right>p.right+1)};
                      }""")
                      assert bounds['documentWidth']<=width+1 and not bounds['overflowing'],bounds
                      assert all(0<=r['left'] and r['right']<=width+1 and r['overflow']=='auto' for r in bounds['scrollers']),bounds
                      for scroller in ci.locator('.ci-plot-scroll').all():
                          scroller.evaluate('n=>n.scrollLeft=n.scrollWidth')
                      assert page.evaluate('document.documentElement.scrollWidth')<=width+1
                      ci_screenshot=OUT/f'ci-{theme}-{width}.png'
                      ci.screenshot(path=str(ci_screenshot))
                      records.append({'kind':'ci-website','theme':theme,'viewport':{'width':width,'height':1000},'groups':groups,'count_geometry':count_geometry,'selected_private':selected,'selected_group':selected_attrs,'focus':group_focus,'bounds':bounds,'screenshot':ci_screenshot.name})
                      page.close()
              for mobile in (False, True):
                  width = 360 if mobile else 840
                  for scenario in ('real', 'zero', 'unknown', 'long'):
                      model = copy.deepcopy(summary)
                      if scenario != 'real':
                          for row in model['facts']:
                              if row['metric_id'] in ('profile.contributions','inventory.public_total','inventory.private_owned','inventory.stargazers'):
                                  row['value'] = {'zero':0,'unknown':None,'long':1234567890}[scenario]
                                  row['display_value'] = {'zero':'0','unknown':'n/a','long':'1,234,567,890'}[scenario]
                                  if scenario == 'unknown': row['quality'] = {'status':'unknown','qualification':'Unavailable'}
                      svg = render_svg(model, mobile=mobile)
                      path = OUT / f'overview-{width}-{scenario}.svg'
                      path.write_text(svg)
                      page = browser.new_page(viewport={'width':width,'height':1000}, device_scale_factor=1)
                      page.goto(path.as_uri(), wait_until='load')
                      result = page.locator('[data-section="overview"]').evaluate('''g=>{
                        const svg=g.ownerSVGElement; const width=svg.viewBox.baseVal.width;
                        const texts=[...g.querySelectorAll('text')].map(n=>{const b=n.getBBox();return{text:n.textContent,x:b.x,right:b.x+b.width,top:b.y,bottom:b.y+b.height,role:n.dataset.role}});
                        const footer=g.querySelector('[data-role="overview-footer"]').getBBox();
                        const weekly=svg.querySelector('[data-section="weekly"]').getBBox();
                        return {width,texts,overflowing:texts.filter(t=>t.x<18||t.right>width-18),
                          facts:[...g.querySelectorAll('[data-metric-id]')].map(n=>({id:n.dataset.metricId,value:n.querySelector('[data-role="value"]').textContent})),
                          timestamp:g.querySelector('[data-role="snapshot-time"]').textContent,
                          footer:{top:footer.y,bottom:footer.y+footer.height},weeklyTop:weekly.y,anchors:g.querySelectorAll('a').length};
                      }''')
                      assert not result['overflowing'], result
                      assert result['timestamp'] == expected_time and result['anchors'] == 0
                      expected = {row['metric_id']: row['display_value'] for row in model['facts'] if row['metric_id'] in ('profile.contributions','inventory.public_total','inventory.private_owned','inventory.stargazers')}
                      assert {row['id']:row['value'] for row in result['facts']} == expected
                      assert max(t['bottom'] for t in result['texts'] if t['role'] == 'value') < result['footer']['top']
                      assert result['weeklyTop'] >= result['footer']['bottom']
                      screenshot = OUT / f'overview-{width}-{scenario}.png'
                      page.screenshot(path=str(screenshot), clip={'x':0,'y':0,'width':width,'height':min(1000,result['weeklyTop']+50)})
                      records.append({'kind':'svg','mobile':mobile,'scenario':scenario,'svg_sha256':hashlib.sha256(svg.encode()).hexdigest(),'probe':result,'screenshot':screenshot.name})
                      if scenario == 'real':
                          panel=page.locator('[data-section="ci-timeline"]')
                          ci_result=panel.evaluate("""g=>{
                            const box=g.getBBox();
                            const texts=[...g.querySelectorAll('text')].map(n=>{const b=n.getBBox();return{text:n.textContent,left:b.x,right:b.x+b.width,top:b.y,bottom:b.y+b.height}});
                            const rows=[...g.querySelectorAll('[data-role="ci-repository-row"]')].map(n=>({repository:n.dataset.repository,count:n.dataset.observedRuns,status:n.dataset.status}));
                            return{box:{x:box.x,y:box.y,width:box.width,height:box.height},texts,rows,overflowing:texts.filter(t=>t.left<box.x+7||t.right>box.x+box.width-7)};
                          }""")
                          assert not ci_result['overflowing'],ci_result
                          count_sizes = panel.locator('[data-role="ci-count"]').evaluate_all(
                              "nodes=>nodes.map(n=>parseFloat(getComputedStyle(n).fontSize))")
                          assert count_sizes and all(size >= 12 for size in count_sizes), count_sizes
                          assert {r['repository'] for r in ci_result['rows']}=={r['repository'] for r in timeline['repositories']}
                          ci_screenshot=OUT/f'ci-svg-{width}.png'
                          panel.screenshot(path=str(ci_screenshot))
                          records.append({'kind':'ci-svg','mobile':mobile,'probe':ci_result,'screenshot':ci_screenshot.name})
                      page.close()
              browser.close()

          receipt = {'purpose':('Actual generated live public artifact review' if live_capture else 'Product browser preview using declared composite captured data; not a live collection or full private Mac CI result'),
              'run_id':os.environ.get('GITHUB_RUN_ID'),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),
              'head':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'chrome':version,
              'producer':'Temporary overview preview workflow, original inline Python',
              'source_sha256':{name:hashlib.sha256((ROOT/name).read_bytes()).hexdigest() for name in ('scripts/pipeline/web_render.py','scripts/rendering/generate_dashboard_summary.py')},
              'snapshot_sha256':hashlib.sha256(raw).hexdigest(),'generated_at':data['generated_at'],
              'index_sha256':hashlib.sha256(page_path.read_bytes()).hexdigest(),'expected_timestamp':expected_time,
              'ci_capture_sha256':hashlib.sha256(ci_raw).hexdigest(),'ci_observed_at':timeline['observed_at'],
              'legacy_producer_qualification':legacy_qualification,
              'fixture_kind':('Actual live generate-profile output; no fixture substitution' if live_capture else 'Immutable public profile snapshot plus separately captured current CI observations; not a live full-profile collection'),'records':records}
          (OUT/'verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps({'head':receipt['head'],'chrome':version,'screenshots':len(records),'index_sha256':receipt['index_sha256'],'expected_timestamp':expected_time}))
          PY_CAPTURE
      - name: Test the actual received artifact set before committing it
        env:
          PERSONAL_GITHUB_TOKEN: ''
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          PROFILE_TOKEN_MODE: none
          CACHE_DIR: ${{ runner.temp }}/candidate-product-tests
          BYPASS_GITHUB_CACHE: 'true'
        run: |
          python -m unittest \
            tests.github.test_github_client \
            tests.github.test_actions_audit \
            tests.github.test_token_fallback \
            tests.pipeline.test_compute_metrics_accuracy \
            tests.pipeline.test_profile_pipeline_fixture \
            tests.contracts.test_data_semantics \
            tests.contracts.test_public_data_privacy \
            tests.contracts.test_design_contract \
            tests.contracts.test_web_dashboard \
            tests.contracts.test_page_manifest \
            tests.contracts.test_dashboard_summary \
            tests.contracts.test_readme_projection \
            tests.contracts.test_visual_receipt_provenance \
            tests.contracts.test_skill_structure \
            tests.contracts.test_design_nav \
            tests.contracts.test_label_legibility
          python scripts/profile_cli.py validate
          python scripts/profile_cli.py publication-status --require-ready
      - name: Commit the coherent generated set to the unchanged task branch
        run: |
          set -euo pipefail
          actual_head=$(git ls-remote --exit-code origin "refs/heads/$CANDIDATE_REF" | cut -f1)
          test "$actual_head" = "$CANDIDATE_HEAD"
          python - <<'PY_STAGE'
          import hashlib,json,os,shutil,subprocess
          from pathlib import Path
          from scripts.contracts import PROFILE_ARTIFACT_PATHS
          paths=list(PROFILE_ARTIFACT_PATHS)+['site/index.html',
            'assets/receipts/pages/index/screenshot-1280.png',
            'assets/receipts/pages/index/screenshot-1280.png.provenance.json',
            'assets/receipts/pages/index/dom-probe-390.json',
            'assets/receipts/pages/index/dom-probe-390.json.provenance.json']
          output=Path(os.environ['PREVIEW_OUTPUT'])/'received-artifacts'
          rows=[]
          for name in paths:
              p=Path(name); target=output/name; target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(p,target)
              raw=p.read_bytes()
              rows.append({'path':name,'sha256':hashlib.sha256(raw).hexdigest(),'bytes':len(raw)})
          (Path(os.environ['PREVIEW_OUTPUT'])/'received-artifact-identities.json').write_text(json.dumps(rows,indent=2)+'\n')
          subprocess.run(['git','add','--',*paths],check=True)
          PY_STAGE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git -c commit.gpgsign=false commit --author='github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' -m 'Refresh the consolidated overview and CI artifact set'
            git push origin "HEAD:refs/heads/$CANDIDATE_REF"
          fi
          git rev-parse HEAD > "$PREVIEW_OUTPUT/received-commit.txt"
      - name: Retain original generated artifacts and actual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overview-live-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/overview-live
          if-no-files-found: error
          retention-days: 30
