name: Test Profile Pipeline

on:
  push:
    branches: ["main", "feature/profile-multi-repo-ci-timeline-20261015"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "contracts/**"
      - "assets/receipts/**"
      - "docs/design/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/analytics.yml"
      - ".github/workflows/metrics.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "contracts/**"
      - "assets/receipts/**"
      - "docs/design/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/analytics.yml"
      - ".github/workflows/metrics.yml"
  workflow_dispatch:

concurrency:
  group: profile-pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Temporary branch-only receipt production, not a production dependency.
      - name: Capture exact index browser receipts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/profile-multi-repo-ci-timeline-20261015' && !startsWith(github.event.head_commit.message, 'ci(receipts):') }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.quality import headless_receipts as receipts
          from scripts.pipeline.web_render import render_dashboard
          import json, shutil
          assert Path("site/index.html").read_text(encoding="utf-8") == render_dashboard()
          Path("site/assets").mkdir(exist_ok=True)
          for name in ("dashboard_summary.svg","dashboard_summary_mobile.svg"):
              shutil.copy2(Path("assets")/name, Path("site/assets")/name)
              assert (Path("assets")/name).read_bytes() == (Path("site/assets")/name).read_bytes()
          binary=shutil.which("google-chrome") or shutil.which("google-chrome-stable")
          if not binary:
              raise RuntimeError("Chrome absent: cannot certify responsive layout")
          receipts.CHROME=Path(binary)
          shot=receipts.screenshot_page("index")
          probe=receipts.dom_probe("index")
          facts=json.loads(probe.read_text())
          if facts.get("client_width")!=390 or facts.get("horizontal_overflow"):
              raise RuntimeError("Measured phone viewport overflow: "+str(facts.get("offenders")))
          print("Chrome receipts",shot,probe)
          PY

      - name: Run tests
        run: |
          python -m unittest \
            tests.github.test_github_client \
            tests.github.test_actions_audit \
            tests.github.test_token_fallback \
            tests.pipeline.test_compute_metrics_accuracy \
            tests.pipeline.test_profile_pipeline_fixture \
            tests.contracts.test_data_semantics \
            tests.contracts.test_public_data_privacy \
            tests.contracts.test_design_contract \
            tests.contracts.test_web_dashboard \
            tests.contracts.test_page_manifest \
            tests.contracts.test_dashboard_summary \
            tests.contracts.test_readme_projection \
            tests.contracts.test_visual_receipt_provenance \
            tests.contracts.test_skill_structure \
            tests.contracts.test_label_legibility

      - name: Fixture smoke CLI run (offline path)
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          PERSONAL_GITHUB_TOKEN: ""
        run: |
          python scripts/profile_cli.py generate-profile --validate --fixture tests/fixtures/sample_collected_data.json

      # Complete candidate bundle includes original README template.
      - name: Pack complete profile candidate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/profile-multi-repo-ci-timeline-20261015' }}
        run: |
          tar -czf "${{ runner.temp }}/profile-source.tar.gz" scripts tests templates contracts site assets docs .github README.md requirements.txt pyproject.toml
      - name: Upload candidate source bundle
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/profile-multi-repo-ci-timeline-20261015' }}
        uses: actions/upload-artifact@v4
        with:
          name: profile-shared-renderer-qualification
          path: ${{ runner.temp }}/profile-source.tar.gz
          if-no-files-found: error
      - name: Upload browser receipts
        if: ${{ always() && github.ref == 'refs/heads/feature/profile-multi-repo-ci-timeline-20261015' }}
        uses: actions/upload-artifact@v4
        with:
          name: profile-browser-qual-receipts
          path: |
            assets/receipts/pages/index/screenshot-1280.png
            assets/receipts/pages/index/screenshot-1280.png.provenance.json
            assets/receipts/pages/index/dom-probe-390.json
            assets/receipts/pages/index/dom-probe-390.json.provenance.json
      - name: Commit browser receipts to candidate branch only
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/feature/profile-multi-repo-ci-timeline-20261015' && !startsWith(github.event.head_commit.message, 'ci(receipts):') }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: feature/profile-multi-repo-ci-timeline-20261015
          commit_message: "ci(receipts): capture shared-card website in genuine Chrome"
          file_pattern: "assets/receipts/pages/index/screenshot-1280.png assets/receipts/pages/index/screenshot-1280.png.provenance.json assets/receipts/pages/index/dom-probe-390.json assets/receipts/pages/index/dom-probe-390.json.provenance.json"
