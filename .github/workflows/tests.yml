name: Test Profile Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "contracts/**"
      - "assets/receipts/**"
      - "docs/design/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/analytics.yml"
      - ".github/workflows/metrics.yml"
  workflow_dispatch:

concurrency:
  group: profile-pipeline-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest \
            tests.github.test_github_client \
            tests.github.test_token_fallback \
            tests.pipeline.test_compute_metrics_accuracy \
            tests.pipeline.test_profile_pipeline_fixture \
            tests.contracts.test_data_semantics \
            tests.contracts.test_public_data_privacy \
            tests.contracts.test_design_contract \
            tests.contracts.test_label_legibility

      - name: Fixture smoke CLI run (offline path)
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          PERSONAL_GITHUB_TOKEN: ""
        run: |
          python scripts/profile_cli.py generate-profile --validate --fixture tests/fixtures/sample_collected_data.json
