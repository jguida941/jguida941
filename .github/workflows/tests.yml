name: Test Profile Pipeline

on:
  push:
    branches: ["main", "feature/profile-ci-execution-20261015"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "site/**"
      - "contracts/**"
      - "assets/receipts/**"
      - "docs/design/**"
      - ".github/workflows/tests.yml"
      - ".github/workflows/analytics.yml"
      - ".github/workflows/metrics.yml"
  workflow_dispatch:

concurrency:
  group: profile-pipeline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.15"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m unittest \
            tests.github.test_github_client \
            tests.github.test_actions_audit \
            tests.github.test_token_fallback \
            tests.pipeline.test_compute_metrics_accuracy \
            tests.pipeline.test_profile_pipeline_fixture \
            tests.contracts.test_data_semantics \
            tests.contracts.test_public_data_privacy \
            tests.contracts.test_design_contract \
            tests.contracts.test_web_dashboard \
            tests.contracts.test_page_manifest \
            tests.contracts.test_skill_structure \
            tests.contracts.test_label_legibility

      # Branch-only: make the exact public candidate checkout available for
      # independent local browser rendering and review, without pushing live data.
      - name: Package CI dashboard candidate
        if: ${{ github.ref == 'refs/heads/feature/profile-ci-execution-20261015' }}
        run: |
          tar -czf "${{ runner.temp }}/profile-ci-candidate.tar.gz" \
            scripts tests contracts site assets docs .github \
            README.md metrics.general.svg requirements.txt pyproject.toml
      - name: Upload CI dashboard candidate
        if: ${{ github.ref == 'refs/heads/feature/profile-ci-execution-20261015' }}
        uses: actions/upload-artifact@v4
        with:
          name: profile-ci-candidate-source
          path: ${{ runner.temp }}/profile-ci-candidate.tar.gz
          if-no-files-found: error

      - name: Fixture smoke CLI run (offline path)
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          PERSONAL_GITHUB_TOKEN: ""
        run: |
          python scripts/profile_cli.py generate-profile --validate --fixture tests/fixtures/sample_collected_data.json
